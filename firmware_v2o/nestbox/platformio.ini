; NestBox_v2O - firmvér NestBox na hardvéri OVMS v3.3 (ESP32 rev3, 16 MB flash, PSRAM 4 MB).
; Návrh a poradie: ../NAVRH.md, logika: ../LOGIKA.mmd.
; Prostredie rovnaké ako NestBox_v1F (firmware_v5/telelogger): PlatformIO, espressif32 6.5.0, Arduino.
; Bez publish_ota.py: build nič nikam neposiela.

[env:ovms33]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
board_build.partitions = partitions_v2o.csv
board_upload.flash_size = 16MB
board_build.f_cpu = 240000000L
; OVMS: flash DIO 40 MHz, PSRAM 40 MHz (support/sdkconfig.default.hw31) - rovnako
board_build.f_flash = 40000000L
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
extra_scripts =
    pre:../../firmware_v5/telelogger/wifi_secrets.py
    pre:fix_psram_cache_linkflags.py
build_flags =
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ESP32_DEV
lib_extra_dirs =
    ../../libraries
lib_ignore =
    FreematicsPlus

[platformio]
src_dir = src
