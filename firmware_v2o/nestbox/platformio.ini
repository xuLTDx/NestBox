; NestBox_v2O - firmvér NestBox na hardvéri OVMS v3.3 (ESP32 rev3, 16 MB flash, PSRAM 4 MB).
; Návrh a poradie: ../NAVRH.md, logika: ../LOGIKA.mmd.
; NAVRH 9 (PG42/PG43, 2026-11-05): Arduino 3.3.11 / ESP-IDF 5.5 (pioarduino 55.03.311). Prečo: ESP-IDF 4.4
; (Arduino 2.0.14) je od 07/2024 bez opráv chýb aj bezpečnosti a nemá PPP (dáta cez modem = PPP + lwIP ako OVMS).
; Vlastný adresár PlatformIO (core_dir): 5.11. platforma Arduina 3 v spoločnom ~/.platformio prepísala balík
; Arduino 2.0.14, ktorý potrebuje NestBox_v1F (firmware_v5/telelogger, espressif32 6.5.0).
; Bez publish_ota.py: build nič nikam neposiela.

[env:ovms33]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions_v2o.csv
board_upload.flash_size = 16MB
board_build.f_cpu = 240000000L
; OVMS: flash DIO 40 MHz, PSRAM 40 MHz (support/sdkconfig.default.hw31). Flash 40 MHz dio je rovnako (riadky nižšie).
; PSRAM NIE: predkompilované knižnice Arduina 3.3.11 majú CONFIG_SPIRAM_SPEED=80 a z platformio.ini sa to nedá
; zmeniť bez preloženia knižníc (custom_sdkconfig = hybrid compile). Overené 10.11.2026; predtým tu stálo
; "PSRAM 40 MHz - rovnako", čo nikdy neplatilo.
board_build.f_flash = 40000000L
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
; fix_psram_cache_linkflags.py (Arduino 2.0.14: -mfix-esp32-psram-cache-issue missing at link) is gone: Arduino 3
; puts it into its own ld_flags (framework-arduinoespressif32-libs/esp32/flags/ld_flags, strategy memw as the libs)
extra_scripts =
    pre:../../firmware_v5/telelogger/wifi_secrets.py
    pre:fresh_build_str.py
build_flags =
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ESP32_DEV
    ; p60 (NAVRH 7): debug commands D1-D4 in; the FINAL build without this line (or =0)
    -DNESTBOX_DIAG=1
lib_extra_dirs =
    ../../libraries
lib_ignore =
    FreematicsPlus

[platformio]
src_dir = src
core_dir = ~/.platformio-v2o

; Bench only: the box generates TEST_SNIFF_LOAD frames/s itself (ID 0x7AA, sequence
; number) and checks the file with SNIFF_CHECK=<n> - the SD path without a car.
[env:ovms33_load]
extends = env:ovms33
build_flags =
    ${env:ovms33.build_flags}
    -DTEST_SNIFF_LOAD=3000
